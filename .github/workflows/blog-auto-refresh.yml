name: 🔄 બ્લોગ આપોઆપ તાજું (CDN purge + થીમ rebake)

# Blogger થીમ ફાઈલો https://cdn.jsdelivr.net/gh/<repo>@main/ થી લાદે, અને jsDelivr એ કૉપિ
# દિવસો સુધી રાખે (query — `?v=` / `?t=` — થીય એ કૉપિ ન તૂટે, એ ફકત browser નો કૉપિ તોડે) ⇒ push કરો છતાં બ્લોગ પર
# જૂનું દેખાઈ શકે. એટલે દર push પછી:
#   job ૧ (purge) ⇒ બધી મુખ્ય ફાઈલ ની jsDelivr કૉપિ તાજી (બ્લોગ ને ફકત refresh કરવો પડે)
#   job ૨ (theme) ⇒ થીમ ફરી બનાવીને repo માં commit (ફાઈલ બદલાઈ હોય તો જ) ⇒ બ્લોગ પર upload
#                   કરવા ની જરૂર ફકત markup બદલાય ત્યારે પડે.
# Admin ⇒ બ્લોગ નું લખાણ આ બંને વગરય તાજું દેખાય (js/catalog.js ⇒ GitHub raw + ?t= bucket
# અને OEG.fresh ⇒ પાનું જાતેય તપાસે). data/ નો ફેરફાર થી એકલો commit નહીં બદલાય.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blog-auto-refresh
  cancel-in-progress: true

jobs:
  purge:
    name: 🧊 jsDelivr કૉપિ તાજી
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: પૂછો ⇒ દરેક મુખ્ય ફાઈલ ની કૉપિ તાજી
        run: node scripts/purge-cdn.mjs
      - name: થોડું રાહ જોઈ બીજી વાર (edge પોપ પ્રમાણે ફેલાતું હોય)
        run: |
          sleep 20
          node scripts/purge-cdn.mjs js/i18n.js js/catalog.js js/app.js js/auth.js js/notify.js js/admin.js styles.css data/site-config.json data/catalog.json

  theme:
    name: 🧩 થીમ rebake (જરૂર હોય તો commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: jsdom (થીમ બનાવવા માટે જ)
        run: npm install --no-audit --no-fund jsdom
      - name: થીમ ફરી બનાવો
        run: node scripts/blogger.mjs
      - name: ફેરફાર હોય તો જ commit + push
        run: |
          git config user.name "OEG bot"
          git config user.email "oeg-bot@users.noreply.github.com"
          git add blogger/OEG-Blogger-Native.xml
          if git diff --cached --quiet; then
            echo "થીમ માં કંઈ ફેરફાર નહીં (markup + js/css એ જ ફાઈલ માં છે) ⇒ commit નહીં."
            exit 0
          fi
          git commit -m "થીમ આપોઆપ તાજો (GitHub Actions) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
